<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="feat-t feat-d">
<title id="feat-t">What's inside</title>
<desc id="feat-d">Start lights: Five red lights, lights out, and the name launches in. Click to skip.; Pick your seat: Recruiter, Engineer, Explorer or Gamer. Every row reorders for you.; F1 transitions: An original top-down car drives up the screen between sections.; Skills arc: Cards swing along an arc as you scroll, with real tech logos.; Starting grid: Projects ranked P1 to P8, rows that slide in, hover previews.; Deep dives: Highlights as laps, behind-the-scenes photos and code links.; Mini-games: Four playable demos built from real projects, on the classic site.; Built with care: Keyboard friendly, responsive, and it honours reduced motion.</desc>

<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.kick{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:12px;letter-spacing:3px;fill:#C77B9B}
.twinkle{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.pulse{animation:pl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
.spin{animation:sp 60s linear infinite;transform-box:view-box}
@keyframes sp{to{transform:rotate(360deg)}}
.float{animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fadein{animation:fi 1.2s ease-out both}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>

<defs>
  <radialGradient id="feat-bg" cx="70%" cy="30%" r="90%">
    <stop offset="0" stop-color="#2A0E1B"/>
    <stop offset=".55" stop-color="#190B12"/>
    <stop offset="1" stop-color="#10070C"/>
  </radialGradient>
  <radialGradient id="feat-glowA" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#701A3D" stop-opacity=".45"/>
    <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="feat-glowB" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#F8F0F3" stop-opacity=".12"/>
    <stop offset="1" stop-color="#F8F0F3" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="feat-silver" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset=".5" stop-color="#D8C4CD"/>
    <stop offset="1" stop-color="#C77B9B"/>
  </linearGradient>
  <linearGradient id="feat-rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#C77B9B" stop-opacity="0"/>
    <stop offset=".25" stop-color="#C77B9B" stop-opacity=".8"/>
    <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
  </linearGradient>
  <pattern id="feat-grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#C77B9B" stroke-opacity=".05"/>
  </pattern>
  <filter id="feat-soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3"/>
  </filter>
</defs>

