<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="proj-t proj-d">
<title id="proj-t">Projects on the grid</title>
<desc id="proj-d">P1 Smart Walker (IoT · Healthcare): Arduino · MPU6050 · HX711 · HC-SR04; P2 Hazard Rover (Robotics · RL): Raspberry Pi 5 · SLAM · YOLOv8n · A*; P3 Dental X-Ray AI (Computer vision): YOLOv9 · Grad-CAM · Gradio; P4 RootLens (Reliability · AIOps): FastAPI · Docker · Prometheus; P5 TriageIQ (LLM · Streaming): Kafka · Ollama · Qdrant; P6 Smart Grocer (Multimodal AI): YOLO · ESP32 · Firebase; P7 Intrusion Detection (Cybersecurity): Python · Threat modeling; P8 Jarvis (Voice assistant): Python · SpeechRecognition</desc>

<style>
.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.kick{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:12px;letter-spacing:3px;fill:#C77B9B}
.twinkle{animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.pulse{animation:pl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
.spin{animation:sp 60s linear infinite;transform-box:view-box}
@keyframes sp{to{transform:rotate(360deg)}}
.float{animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fadein{animation:fi 1.2s ease-out both}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>

<defs>
  <radialGradient id="proj-bg" cx="70%" cy="30%" r="90%">
    <stop offset="0" stop-color="#2A0E1B"/>
    <stop offset=".55" stop-color="#190B12"/>
    <stop offset="1" stop-color="#10070C"/>
  </radialGradient>
  <radialGradient id="proj-glowA" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#701A3D" stop-opacity=".45"/>
    <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="proj-glowB" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#F8F0F3" stop-opacity=".12"/>
    <stop offset="1" stop-color="#F8F0F3" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="proj-silver" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset=".5" stop-color="#D8C4CD"/>
    <stop offset="1" stop-color="#C77B9B"/>
  </linearGradient>
  <linearGradient id="proj-rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#C77B9B" stop-opacity="0"/>
    <stop offset=".25" stop-color="#C77B9B" stop-opacity=".8"/>
    <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
  </linearGradient>
  <pattern id="proj-grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#C77B9B" stroke-opacity=".05"/>
  </pattern>
  <filter id="proj-soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3"/>
  </filter>
</defs>

<rect x="1" y="1" width="1198" height="558" rx="22" fill="url(#proj-bg)" stroke="#3A1828"/>
<rect x="1" y="1" width="1198" height="558" rx="22" fill="url(#proj-grid)"/>
<ellipse cx="900" cy="168" rx="420" ry="392" fill="url(#proj-glowA)"/>
<ellipse cx="300" cy="392" rx="300" ry="280" fill="url(#proj-glowB)"/><rect x="32" y="32" width="1136" height="52" rx="14" fill="#1F0C16" stroke="#4E2236"/><text x="58" y="67" class="serif" font-size="22" font-style="italic" fill="#C77B9B">P1</text><text x="118" y="66" class="serif" font-size="20" fill="#F8F0F3" text-anchor="start" >Smart Walker</text><text x="360" y="64" class="mono" font-size="13" fill="#E5B5C7" text-anchor="start" letter-spacing="1">IoT · Healthcare</text><text x="580" y="64" class="sans" font-size="13.5" fill="#B6A3AC" text-anchor="start" >Arduino · MPU6050 · HX711 · HC-SR04</text><circle class="pulse" cx="1010" cy="59" r="3.5" fill="#FF8FB1" style="animation-delay:0.0s"/><text x="1150" y="63" class="mono" font-size="10.5" fill="#FF8FB1" text-anchor="end" letter-spacing="2">PATENT · FILING</text><rect x="32" y="94" width="1136" height="52" rx="14" fill="#1F0C16" stroke="#4E2236"/><text x="58" y="129" class="serif" font-size="22" font-style="italic" fill="#C77B9B">P2</text><text x="118" y="128" class="serif" font-size="20" fill="#F8F0F3" text-anchor="start" >Hazard Rover</text><text x="360" y="126" class="mono" font-size="13" fill="#E5B5C7" text-anchor="start" letter-spacing="1">Robotics · RL</text><text x="580" y="126" class="sans" font-size="13.5" fill="#B6A3AC" text-anchor="start" >Raspberry Pi 5 · SLAM · YOLOv8n · A*</text><circle class="pulse" cx="1102" cy="121" r="3.5" fill="#8FE3C8" style="animation-delay:0.3s"/><text x="1150" y="125" class="mono" font-size="10.5" fill="#8FE3C8" text-anchor="end" letter-spacing="2">REPO</text><rect x="32" y="156" width="1136" height="52" rx="14" fill="#1F0C16" stroke="#4E2236"/><text x="58" y="191" class="serif" font-size="22" font-style="italic" fill="#C77B9B">P3</text><text x="118" y="190" class="serif" font-size="20" fill="#F8F0F3" text-anchor="start" >Dental X-Ray AI</text><text x="360" y="188" class="mono" font-size="13" fill="#E5B5C7" text-anchor="start" letter-spacing="1">Computer vision</text><text