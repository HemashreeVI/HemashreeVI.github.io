<text x="600" y="62" class="mono" font-size="12" fill="#C77B9B" text-anchor="middle" letter-spacing="4">BOX, BOX · LET'S BUILD SOMETHING FAST</text>
<text x="600" y="164" class="serif" font-size="96" font-style="italic" text-anchor="middle" fill="url(#foot-silver)" letter-spacing="2">Hemashree<tspan fill="#FF8FB1">.</tspan></text>
